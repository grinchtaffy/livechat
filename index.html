<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Messaging App</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; display: flex; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* Auth Screen */
        #auth-screen { margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        #auth-screen input, #auth-screen button { width: 100%; margin: 10px 0; padding: 12px; box-sizing: border-box; font-size: 16px; border-radius: 6px; }
        #auth-screen input { border: 1px solid #ccc; }
        #auth-screen button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        .author-tag { font-size: 12px; color: #95a5a6; margin-top: 15px; font-weight: bold; }
        
        /* App Layout */
        #app-screen { display: flex; width: 100%; height: 100%; position: relative; }
        
        /* Sidebar */
        #sidebar { width: 300px; background: #2c3e50; color: white; display: flex; flex-direction: column; height: 100%; border-right: 1px solid #1a252f; }
        .sidebar-header { padding: 20px; background: #1a252f; text-align: center; }
        .sidebar-header h3 { margin: 0 0 10px 0; font-size: 1.3em;}
        .sidebar-header button { cursor: pointer; padding: 8px 12px; background: #e74c3c; color: white; border: none; border-radius: 3px; font-weight: bold;}
        .section { padding: 15px; border-bottom: 1px solid #34495e; }
        .section h4 { margin: 0 0 10px 0; }
        .section input, .section button { width: 100%; margin-top: 5px; padding: 10px; box-sizing: border-box; font-size: 14px; border-radius: 4px; border:none;}
        .section button { background: #007bff; color: white; font-weight: bold; cursor: pointer;}
        
        .list-item { padding: 12px; background: #34495e; margin-top: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .list-item:hover { background: #415b76; }
        .friend-name-area { display: flex; align-items: center; font-size: 1.1em;}
        .blue-dot { width: 12px; height: 12px; background-color: #3498db; border-radius: 50%; display: inline-block; margin-left: 10px; box-shadow: 0 0 5px rgba(52, 152, 219, 0.8);}
        
        .btn-small { background: #2ecc71; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 3px; font-weight: bold;}
        
        /* Chat Area */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: white; height: 100%; position: relative; }
        #chat-header { padding: 20px; background: #ecf0f1; border-bottom: 1px solid #bdc3c7; font-size: 1.2em; font-weight: bold; display: flex; align-items: center; }
        #mobile-back-btn { background: none; border: none; color: #007bff; font-size: 1em; cursor: pointer; margin-right: 15px; display: none; font-weight: bold; }
        
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; background: #ffffff; }
        
        /* Message & Reactions Styling */
        .msg-container { display: flex; flex-direction: column; max-width: 70%; position: relative; }
        .msg-container.sent { align-self: flex-end; align-items: flex-end; }
        .msg-container.received { align-self: flex-start; align-items: flex-start; }
        
        .msg { padding: 12px 16px; border-radius: 18px; word-wrap: break-word; font-size: 15px; line-height: 1.4; cursor: pointer; user-select: none; -webkit-user-select: none; }
        .msg.sent { background: #007bff; color: white; border-bottom-right-radius: 4px; }
        .msg.received { background: #f1f0f0; color: black; border-bottom-left-radius: 4px; }
        
        .media-content { max-width: 100%; border-radius: 12px; display: block; margin-top: 5px; }
        .audio-player { width: 220px; height: 40px; outline: none; margin-top: 5px; }
        
        .reactions-box { display: flex; gap: 2px; position: absolute; bottom: -12px; z-index: 5; background: white; padding: 2px 6px; border-radius: 12px; font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); border: 1px solid #ecf0f1; }
        .msg-container.sent .reactions-box { right: 10px; }
        .msg-container.received .reactions-box { left: 10px; }

        .meta-data { font-size: 0.75em; margin-top: 6px; display: flex; gap: 5px; align-items: center; }
        .meta-time { color: #95a5a6; }
        
        /* Chat Input Area */
        #chat-input-area { padding: 15px 20px; border-top: 1px solid #bdc3c7; display: flex; gap: 10px; align-items: center; background: #f8f9fa; position: relative; }
        #chat-input-area input[type="text"] { flex: 1; padding: 14px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-size: 15px; }
        .icon-btn { width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer; font-size: 20px; display: flex; justify-content: center; align-items: center; background: #e0e4e8; color: #2c3e50; transition: background 0.2s; }
        .icon-btn:hover { background: #cbd0d6; }
        .icon-btn.recording { background: #e74c3c; color: white; animation: pulse 1s infinite; }
        .action-btn { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 15px;}

        /* Reaction Popup Menu */
        #reaction-menu { position: absolute; background: white; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); padding: 8px 12px; display: flex; gap: 12px; z-index: 2000; font-size: 24px; transition: opacity 0.2s; }
        #reaction-menu span { cursor: pointer; transition: transform 0.2s; user-select: none; }
        #reaction-menu span:hover { transform: scale(1.3); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Mobile Adjustments */
        @media screen and (max-width: 768px) {
            #sidebar { width: 100%; border-right: none; }
            #chat-area { position: absolute; top: 0; left: 0; width: 100%; z-index: 10; display: none; }
            #chat-area.mobile-active { display: flex; } 
            #mobile-back-btn { display: inline-block; } 
            .msg-container { max-width: 85%; } 
            .action-btn, .icon-btn { padding: 10px; font-size: 16px; }
            #reaction-menu { font-size: 28px; padding: 10px 15px; gap: 15px; }
        }
    </style>
</head>
<body>

    <div id="reaction-menu" class="hidden">
        <span onclick="applyReaction('❤️')">❤️</span>
        <span onclick="applyReaction('👍')">👍</span>
        <span onclick="applyReaction('👎')">👎</span>
        <span onclick="applyReaction('😂')">😂</span>
        <span onclick="applyReaction('‼️')">‼️</span>
        <span onclick="applyReaction('❓')">❓</span>
        <span id="unsend-btn" onclick="unsendMessage()" style="display:none; color: red; border-left: 1px solid #ccc; padding-left: 10px; margin-left: 5px;" title="Unsend">🗑️</span>
    </div>

    <input type="file" id="hidden-upload" accept="image/*" class="hidden" onchange="processImage(event)">

    <div id="live-camera-modal" class="hidden" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:black; z-index:3000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <video id="live-video" autoplay playsinline style="width:100%; max-height:80vh; object-fit:contain;"></video>
        <div style="display:flex; gap:30px; margin-top:20px; align-items: center;">
            <button onclick="closeLiveCamera()" style="padding:10px 20px; background:#e74c3c; color:white; border:none; border-radius:5px; font-weight:bold; font-size:16px; cursor:pointer;">Cancel</button>
            <button onclick="takeShutterPicture()" style="width:70px; height:70px; border-radius:50%; background:white; border:5px solid #bdc3c7; cursor:pointer;"></button>
            <button onclick="flipCamera()" style="padding:10px 20px; background:#f39c12; color:white; border:none; border-radius:5px; font-weight:bold; font-size:16px; cursor:pointer;">🔄 Flip</button>
        </div>
    </div>

    <div id="auth-screen">
        <h2>Welcome to Messenger</h2>
        <input type="text" id="auth-username" placeholder="Username">
        <input type="password" id="auth-password" placeholder="Password">
        <button onclick="login()">Log In</button>
        <button onclick="signUp()" style="background-color: #28a745;">Sign Up</button>
        <p id="auth-error" style="color: red; font-size: 14px; font-weight: bold; margin-top: 15px;"></p>
        <div class="author-tag">Made by Aditya Poddar</div>
    </div>

    <div id="app-screen" class="hidden">
        <div id="sidebar">
            <div class="sidebar-header">
                <h3 id="my-username-display">Loading...</h3>
                <button onclick="logout()">Log Out</button>
            </div>
            <div class="section">
                <h4>Add Friend</h4>
                <input type="text" id="add-friend-username" placeholder="Friend's Username">
                <button onclick="sendFriendRequest()">Send Request</button>
            </div>
            <div class="section">
                <h4>Friend Requests</h4>
                <div id="requests-list"></div>
            </div>
            <div class="section" style="flex: 1; overflow-y: auto;">
                <h4>Friends List</h4>
                <div id="friends-list"></div>
            </div>
        </div>

        <div id="chat-area" class="hidden">
            <div id="chat-header">
                <button id="mobile-back-btn" onclick="closeMobileChat()">⬅ Back</button>
                <span id="chat-header-name">Select a friend to chat</span>
            </div>
            <div id="messages" onclick="hideMenus()"></div>
            
            <div id="chat-input-area">
                <div id="camera-options-menu" class="hidden" style="position: absolute; bottom: 70px; left: 10px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 1000;">
                    <button onclick="openLiveCamera()" class="action-btn" style="background: #2ecc71;">📸 Take Picture</button>
                    <button onclick="document.getElementById('hidden-upload').click(); toggleCameraMenu();" class="action-btn" style="background: #3498db;">🖼️ Upload Image</button>
                </div>

                <button class="icon-btn" onclick="toggleCameraMenu()">📷</button>
                <button id="mic-btn" class="icon-btn" onclick="toggleRecording()">🎤</button>
                <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendTextMessage()">
                <button class="action-btn" onclick="sendTextMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjQ4F-UhswfcW634XUcNqDf3DE0a8O68I",
            authDomain: "chatapp-b0c63.firebaseapp.com",
            databaseURL: "https://chatapp-b0c63-default-rtdb.firebaseio.com",
            projectId: "chatapp-b0c63",
            storageBucket: "chatapp-b0c63.firebasestorage.app",
            messagingSenderId: "920353833960",
            appId: "1:920353833960:web:051f63d23a96b8985f1a5d"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let currentChatData = null; 
        let myFriendsData = {};
        let myNicknamesData = {};
        let backgroundListeners = {}; 

        // Reaction Menu State
        let activeReactionMsgKey = null;

        // Audio & Video Recording State
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let currentVideoStream = null;
        let currentFacingMode = 'environment'; // Controls front/back camera

        // ==========================================
        // AUTHENTICATION LOGIC
        // ==========================================
        function signUp() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;
            const errorDisplay = document.getElementById('auth-error');
            errorDisplay.innerText = ""; 

            if (!username || !password) return alert("Please enter a username and password.");
            const fakeEmail = username.toLowerCase() + "@chatapp.local";

            db.ref('usernames/' + username).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    errorDisplay.innerText = "Username already taken.";
                } else {
                    auth.createUserWithEmailAndPassword(fakeEmail, password)
                        .then((userCredential) => {
                            db.ref('users/' + userCredential.user.uid).set({ 
                                username: username, password: password 
                            });
                            db.ref('usernames/' + username).set(userCredential.user.uid);
                        })
                        .catch(err => errorDisplay.innerText = "Error: " + err.message);
                }
            }).catch(err => errorDisplay.innerText = "Database Error: " + err.message);
        }

        function login() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;
            const errorDisplay = document.getElementById('auth-error');
            errorDisplay.innerText = "";
            if (!username || !password) return alert("Please enter both username and password.");

            const fakeEmail = username.toLowerCase() + "@chatapp.local";
            auth.signInWithEmailAndPassword(fakeEmail, password)
                .catch(err => errorDisplay.innerText = "Login failed. Check your credentials.");
        }

        function logout() { backgroundListeners = {}; auth.signOut(); }

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                db.ref('users/' + currentUser.uid).once('value').then(snap => {
                    if(snap.val()) document.getElementById('my-username-display').innerText = snap.val().username;
                });
                loadFriendRequests(); loadFriendsAndNicknames();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        // ==========================================
        // FRIENDS LOGIC 
        // ==========================================
        function sendFriendRequest() {
            const target = document.getElementById('add-friend-username').value.trim();
            if (!target) return;
            db.ref('usernames/' + target).once('value').then(snap => {
                if (!snap.exists()) return alert("User not found!");
                const targetUid = snap.val();
                if (targetUid === currentUser.uid) return alert("You can't add yourself!");
                db.ref('users/' + currentUser.uid).once('value').then(uSnap => {
                    db.ref('friendRequests/' + targetUid + '/' + currentUser.uid).set(uSnap.val().username);
                    alert("Friend request sent!"); document.getElementById('add-friend-username').value = '';
                });
            });
        }

        function loadFriendRequests() {
            db.ref('friendRequests/' + currentUser.uid).on('value', snap => {
                const list = document.getElementById('requests-list'); list.innerHTML = '';
                snap.forEach(child => {
                    list.innerHTML += `<div class="list-item"><span>${child.val()}</span><button class="btn-small" onclick="acceptRequest('${child.key}', '${child.val()}')">Accept</button></div>`;
                });
            });
        }

        function acceptRequest(fromUid, fromUsername) {
            db.ref('users/' + currentUser.uid).once('value').then(snap => {
                db.ref('friends/' + currentUser.uid + '/' + fromUid).set(fromUsername);
                db.ref('friends/' + fromUid + '/' + currentUser.uid).set(snap.val().username);
                db.ref('friendRequests/' + currentUser.uid + '/' + fromUid).remove();
            });
        }

        function loadFriendsAndNicknames() {
            db.ref('friends/' + currentUser.uid).on('value', snap => { myFriendsData = snap.val() || {}; renderFriendsList(); });
            db.ref('nicknames/' + currentUser.uid).on('value', snap => { myNicknamesData = snap.val() || {}; renderFriendsList(); });
        }

        function renderFriendsList() {
            const list = document.getElementById('friends-list'); list.innerHTML = '';
            for (const friendUid in myFriendsData) {
                const displayName = myNicknamesData[friendUid] || myFriendsData[friendUid];
                list.innerHTML += `
                    <div class="list-item" onclick="openChat('${friendUid}', '${myFriendsData[friendUid]}')">
                        <div class="friend-name-area">
                            <span>${displayName}</span>
                            <span id="dot-${friendUid}" class="blue-dot hidden"></span>
                        </div>
                    </div>`;
                startBackgroundListener(friendUid);
            }
        }

        // ==========================================
        // MEDIA CAPTURE LOGIC (Camera & Mic)
        // ==========================================
        function toggleCameraMenu() {
            document.getElementById('camera-options-menu').classList.toggle('hidden');
        }

        function openLiveCamera() {
            document.getElementById('camera-options-menu').classList.add('hidden'); // safely close menu
            document.getElementById('live-camera-modal').classList.remove('hidden');
            startCameraStream();
        }

        function startCameraStream() {
            if (currentVideoStream) {
                currentVideoStream.getTracks().forEach(track => track.stop());
            }
            navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } })
            .then(stream => {
                currentVideoStream = stream;
                document.getElementById('live-video').srcObject = stream;
            })
            .catch(err => {
                alert("Camera error: " + err.message);
                closeLiveCamera();
            });
        }

        function flipCamera() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            startCameraStream();
        }

        function takeShutterPicture() {
            const video = document.getElementById('live-video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Data = canvas.toDataURL('image/jpeg', 0.6);
            sendMediaMessage(base64Data, 'image');
            closeLiveCamera();
        }

        function closeLiveCamera() {
            document.getElementById('live-camera-modal').classList.add('hidden');
            if(currentVideoStream) {
                currentVideoStream.getTracks().forEach(track => track.stop());
                currentVideoStream = null;
            }
        }

        function processImage(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let w = img.width, h = img.height;
                    if(w > MAX_WIDTH) { h *= MAX_WIDTH/w; w = MAX_WIDTH; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    const base64Data = canvas.toDataURL('image/jpeg', 0.6); 
                    sendMediaMessage(base64Data, 'image');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function toggleRecording() {
            const btn = document.getElementById('mic-btn');
            if(!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('recording');
                    btn.innerText = '⏹'; 
                    audioChunks = [];

                    mediaRecorder.addEventListener("dataavailable", event => {
                        audioChunks.push(event.data);
                    });

                    mediaRecorder.addEventListener("stop", () => {
                        const audioBlob = new Blob(audioChunks);
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob); 
                        reader.onloadend = () => {
                            sendMediaMessage(reader.result, 'audio');
                        };
                    });
                } catch(e) {
                    alert("Microphone permission denied.");
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop()); 
                isRecording = false;
                btn.classList.remove('recording');
                btn.innerText = '🎤';
            }
        }

        function sendMediaMessage(base64Data, mediaType) {
            if (!currentChatData) return;
            const msgData = {
                sender: currentUser.uid, text: base64Data, type: mediaType,
                status: 'sent', timestamp: firebase.database.ServerValue.TIMESTAMP
            };
            db.ref('chats/' + currentChatData.chatId).push(msgData);
        }

        function sendTextMessage() {
            if (!currentChatData) return;
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;
            db.ref('chats/' + currentChatData.chatId).push({
                sender: currentUser.uid, text: text, type: 'text',
                status: 'sent', timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            input.value = '';
        }

        // ==========================================
        // CHAT LOGIC & REACTIONS
        // ==========================================
        let currentMessagesRef = null;

        function startBackgroundListener(friendUid) { /* Background Listener Left Intact */ }
        function closeMobileChat() { document.getElementById('chat-area').classList.remove('mobile-active'); currentChatData = null; }

        function openChat(friendUid, originalUsername) {
            const chatArea = document.getElementById('chat-area');
            chatArea.classList.remove('hidden');
            chatArea.classList.add('mobile-active');
            
            const displayName = myNicknamesData[friendUid] || originalUsername;
            document.getElementById('chat-header-name').innerText = "Chat with " + displayName;
            document.getElementById('messages').innerHTML = ''; 

            const chatId = currentUser.uid < friendUid ? currentUser.uid + "_" + friendUid : friendUid + "_" + currentUser.uid;
            currentChatData = { uid: friendUid, username: originalUsername, chatId: chatId };

            if (currentMessagesRef) currentMessagesRef.off();
            currentMessagesRef = db.ref('chats/' + chatId);
            
            currentMessagesRef.on('child_added', snap => renderMessage(snap.key, snap.val()));
            currentMessagesRef.on('child_changed', snap => updateMessageUI(snap.key, snap.val()));
        }

        function renderMessage(msgKey, msg) {
            const isMe = msg.sender === currentUser.uid;
            const timeString = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            const wrapper = document.createElement('div');
            wrapper.className = 'msg-container ' + (isMe ? 'sent' : 'received');
            wrapper.id = 'msg-wrapper-' + msgKey;

            const bubble = document.createElement('div');
            bubble.className = 'msg ' + (isMe ? 'sent' : 'received');
            bubble.id = 'bubble-' + msgKey;

            let pressTimer;
            bubble.addEventListener('contextmenu', (e) => { e.preventDefault(); showReactionMenu(e, msgKey, isMe); });
            bubble.addEventListener('touchstart', (e) => { pressTimer = setTimeout(() => { e.preventDefault(); showReactionMenu(e, msgKey, isMe); }, 500); });
            bubble.addEventListener('touchend', () => clearTimeout(pressTimer));
            bubble.addEventListener('touchmove', () => clearTimeout(pressTimer));

            const reactionsBox = document.createElement('div');
            reactionsBox.className = 'reactions-box hidden';
            reactionsBox.id = 'reactions-' + msgKey;

            const meta = document.createElement('div');
            meta.className = 'meta-data';
            meta.innerHTML = `<span class="meta-time">${timeString}</span> <span id="receipt-${msgKey}"></span>`;

            wrapper.appendChild(bubble);
            wrapper.appendChild(reactionsBox);
            wrapper.appendChild(meta);
            document.getElementById('messages').appendChild(wrapper);
            
            updateMessageUI(msgKey, msg); 
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }

        function updateMessageUI(msgKey, msg) {
            const isMe = msg.sender === currentUser.uid;
            const bubble = document.getElementById('bubble-' + msgKey);

            if (bubble) {
                if (msg.type === 'unsent') {
                    if(bubble.getAttribute('data-unsent') !== 'true') {
                        bubble.innerHTML = '';
                        bubble.style.fontStyle = 'italic';
                        bubble.style.color = '#7f8c8d';
                        bubble.style.background = 'transparent';
                        bubble.style.border = '1px solid #bdc3c7';
                        
                        bubble.innerText = isMe ? "You unsent a message" : (currentChatData.username + " unsent a message");
                        bubble.setAttribute('data-unsent', 'true');
                    }
                } else {
                    if (!bubble.hasAttribute('data-content-set')) {
                        if (msg.type === 'image') {
                            bubble.innerHTML = `<img src="${msg.text}" class="media-content">`;
                        } else if (msg.type === 'audio') {
                            bubble.innerHTML = `<audio controls src="${msg.text}" class="audio-player"></audio>`;
                        } else {
                            bubble.innerText = msg.text; 
                        }
                        bubble.setAttribute('data-content-set', 'true');
                    }
                }
            }

            const receiptElement = document.getElementById('receipt-' + msgKey);
            if (receiptElement && msg.sender === currentUser.uid) {
                let statusText = "Sent ✓"; let statusColor = "#95a5a6";
                if (msg.status === 'delivered') { statusText = "Delivered ✓✓"; } 
                else if (msg.status === 'read') { statusText = "Read ✓✓"; statusColor = "#3498db"; }
                receiptElement.style.color = statusColor;
                receiptElement.innerText = " • " + statusText;
                
                if (msg.type === 'unsent') {
                    receiptElement.innerText = ''; // Hide receipt if unsent
                }
            }

            const reactionsBox = document.getElementById('reactions-' + msgKey);
            if (reactionsBox) {
                if (msg.reactions && msg.type !== 'unsent') {
                    reactionsBox.classList.remove('hidden');
                    const allReactions = Object.values(msg.reactions);
                    reactionsBox.innerText = allReactions.join(' ');
                } else {
                    reactionsBox.classList.add('hidden');
                }
            }
        }

        // ==========================================
        // REACTION & UNSEND MENU LOGIC
        // ==========================================
        function showReactionMenu(e, msgKey, isMe) {
            const menu = document.getElementById('reaction-menu');
            activeReactionMsgKey = msgKey;
            
            const unsendBtn = document.getElementById('unsend-btn');
            if (isMe) {
                unsendBtn.style.display = 'inline-block';
            } else {
                unsendBtn.style.display = 'none';
            }

            menu.classList.remove('hidden');

            let x = e.clientX || (e.touches && e.touches[0].clientX);
            let y = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (x > window.innerWidth - 250) x = window.innerWidth - 250;
            
            menu.style.left = x + 'px';
            menu.style.top = (y - 50) + 'px'; 
        }

        function hideMenus() {
            document.getElementById('reaction-menu').classList.add('hidden');
            document.getElementById('camera-options-menu').classList.add('hidden');
            activeReactionMsgKey = null;
        }

        function applyReaction(emoji) {
            if (!activeReactionMsgKey || !currentChatData) return;
            
            // Do not allow reactions on unsent messages
            db.ref(`chats/${currentChatData.chatId}/${activeReactionMsgKey}`).once('value').then(snap => {
                if(snap.val() && snap.val().type === 'unsent') return hideMenus();
                
                const ref = db.ref(`chats/${currentChatData.chatId}/${activeReactionMsgKey}/reactions/${currentUser.uid}`);
                ref.once('value').then(rSnap => {
                    if (rSnap.val() === emoji) ref.remove(); 
                    else ref.set(emoji);
                });
                hideMenus();
            });
        }

        function unsendMessage() {
            if (!activeReactionMsgKey || !currentChatData) return;
            if (confirm("Are you sure you want to unsend this message?")) {
                db.ref(`chats/${currentChatData.chatId}/${activeReactionMsgKey}`).update({
                    type: 'unsent',
                    text: '',
                    reactions: null
                });
            }
            hideMenus();
        }

        window.addEventListener('beforeunload', function (e) {
            e.preventDefault(); e.returnValue = '';
        });
    </script>
</body>
</html>
